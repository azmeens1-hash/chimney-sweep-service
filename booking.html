<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book an Appointment — WarmNest Chimney</title>
<meta name="description" content="Book a chimney sweeping, inspection, cap installation, or repair appointment with WarmNest Chimney, Hyderabad.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
<link rel="stylesheet" href="css/booking.css?v=20260919c">
<script>
  // Anti-flash: apply saved theme before first paint.
  (function () {
    var t = localStorage.getItem('warmNestTheme');
    if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    var d = localStorage.getItem('warmNestDir');
    if (d === 'rtl') document.documentElement.setAttribute('dir', 'rtl');
  })();
</script>
</head>
<body data-page="booking">

<div class="booking-page">
  <div class="booking-blob booking-blob-1" aria-hidden="true"></div>
  <div class="booking-blob booking-blob-2" aria-hidden="true"></div>

  <div class="booking-corner-actions">
    <button class="icon-toggle theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
      <svg class="icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
    <button class="icon-toggle rtl-toggle" type="button" aria-label="Toggle right-to-left layout" aria-pressed="false">RTL</button>
  </div>

  <div class="booking-card">
    <a href="home.html" class="booking-brand">
      <svg viewBox="0 0 120 112" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path class="logo-stroke" d="M10 104H110" stroke-width="3" stroke-linecap="round"/>
        <path d="M40 4C40 4 20 28 20 46C20 56.5 28.9 66 40 66C51.1 66 60 56.5 60 46C60 28 40 4 40 4Z" fill="#A8431E"/>
        <path d="M41 20C41 20 28 34 28 46C28 53 33.9 58 41 58C48.1 58 54 53 54 46C54 34 41 20 41 20Z" fill="#D9631A"/>
        <rect class="logo-fill" x="36" y="66" width="48" height="36"/>
        <path class="logo-stroke" d="M14 72L60 30L106 72" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="logo-stroke" d="M30 74L60 46L90 74" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <rect class="logo-fill" x="79" y="26" width="19" height="6" rx="1"/>
        <rect class="logo-fill" x="82" y="30" width="13" height="34"/>
        <path class="logo-stroke" d="M85 24C85 24 80 20 85 16C90 12 85 8 85 4" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
        <path class="logo-stroke" d="M93 24C93 24 88 20 93 16C98 12 93 8 93 4" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
        <rect class="logo-cutout" x="50" y="84" width="16" height="18"/>
        <rect class="logo-cutout" x="52" y="76" width="5" height="5"/>
        <rect class="logo-cutout" x="59" y="76" width="5" height="5"/>
      </svg>
      <span class="booking-brand-copy">
        <span class="booking-brand-text">WarmNest <span>Chimney</span></span>
        <span class="booking-brand-tag">Sweep &middot; Inspect &middot; Protect</span>
      </span>
    </a>

    <div class="booking-card-body">
      <span class="kicker">Book an appointment</span>
      <h1>Let's get you a slot</h1>
      <p class="booking-sub">Fill this in and we'll confirm your appointment within one business day.</p>

      <form id="booking-form" class="booking-form" novalidate>
        <div class="form-row">
          <div class="form-field">
            <label for="b-name">Full name</label>
            <input type="text" id="b-name" name="fullName" autocomplete="name" required>
          </div>
          <div class="form-field">
            <label for="b-phone">Phone number</label>
            <input type="tel" id="b-phone" name="phone" autocomplete="tel" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="b-service">Service needed</label>
            <select id="b-service" name="service" required>
              <option value="" disabled selected>Choose a service</option>
              <option value="sweeping">Chimney Sweeping</option>
              <option value="inspection">Safety Inspection</option>
              <option value="cap">Cap Installation</option>
              <option value="relining">Relining &amp; Repair</option>
              <option value="unsure">Not sure yet</option>
            </select>
          </div>
          <div class="form-field">
            <label for="b-date">Preferred date</label>
            <input type="date" id="b-date" name="preferredDate">
          </div>
        </div>

        <button type="submit" class="btn-primary booking-submit">Confirm Booking</button>
      </form>

      <div class="booking-success" id="booking-success" role="status" tabindex="-1" hidden>
        <span class="booking-success-icon" aria-hidden="true">&#10003;</span>
        <h2>You're booked in</h2>
        <p>We'll confirm your appointment by phone or email within one business day.</p>
        <a href="home.html" class="btn-secondary">Back to home</a>
      </div>
    </div>
  </div>
</div>

<script src="js/booking.js"></script>
</body>
</html>
